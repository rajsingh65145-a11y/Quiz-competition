<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Competition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        
        <!-- Header -->
        <div class="card-header">
            <div class="card-badge">Economics Quiz Assessment</div>
            <h1>Quiz Competition</h1>
            <p>Enter your candidate details to begin the assessment.</p>
        </div>

        <!-- Registration Form -->
        <form id="loginForm" onsubmit="event.preventDefault(); startQuiz();">
            
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter Your Name" autocomplete="name" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="class">Class / Standard</label>
                <input type="text" id="class" placeholder="Enter Your Class (e.g. Standard 12)" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="roll">Roll Number</label>
                <input type="text" id="roll" placeholder="Enter Roll Number" required>
            </div>

            <p id="errorMsg" class="form-error">Please fill in all candidate details before starting.</p>

            <button type="submit" class="btn btn-primary btn-block">
                Start Quiz
            </button>
        </form>

    </main>

    <script>
        // Check for previous session candidate details
        
        function startQuiz() {
            const name = document.getElementById("name").value.trim();
            const studentClass = document.getElementById("class").value.trim();
            const roll = document.getElementById("roll").value.trim();
            const errorEl = document.getElementById("errorMsg");

            if (!name || !studentClass || !roll) {
                if (errorEl) {
                    errorEl.style.display = "block";
                } else {
                    alert("Please fill all details");
                }
                return;
            }

            if (errorEl) errorEl.style.display = "none";

            // Save candidate details
            localStorage.setItem("username", name);
            localStorage.setItem("class", studentClass);
            localStorage.setItem("roll", roll);

            // Clean previous quiz session state for a fresh attempt
            localStorage.removeItem("answers");
            localStorage.removeItem("quizTimeRemaining");

            window.location.href = "quiz.html";
        }
    </script>

</body>
</html>
